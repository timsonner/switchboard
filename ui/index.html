<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switchboard</title>
  <style>
    :root {
      --bg: #0e1014;
      --panel: #161a22;
      --panel-2: #1c212c;
      --line: #2a3140;
      --text: #eceae4;
      --muted: #8d93a0;
      --accent: #d4b06a;
      --ok: #6fbf7a;
      --bad: #d27a7a;
      --run: #7aa2d4;
    }
    * { box-sizing: border-box; }
    html, body { height: 100vh; height: 100dvh; margin: 0; overflow: hidden; }
    body {
      font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.55rem 1rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header strong { color: var(--accent); font-weight: 650; letter-spacing: 0.02em; }
    .counts { color: var(--muted); font-size: 0.8rem; }
    .counts b { color: var(--text); font-weight: 600; }
    main {
      display: grid;
      grid-template-columns: 15.5rem minmax(0, 1fr) 23rem;
      min-height: 0;
    }
    aside, section { min-height: 0; overflow: auto; }
    .rail { background: var(--panel); border-right: 1px solid var(--line); padding: 0.75rem; }
    .team { background: var(--panel-2); border-left: 1px solid var(--line); padding: 0.75rem; }
    .desk { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
    h2 {
      margin: 0 0 0.6rem;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .item, .card, .msg, .form {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.55rem 0.7rem;
      margin-bottom: 0.45rem;
      background: #141821;
    }
    .item { cursor: pointer; }
    .item.active { border-color: var(--accent); background: #221c12; }
    .item small, .card small, .msg small { color: var(--muted); display: block; font-size: 0.75rem; }
    .msg.user { background: #222836; }
    .msg.system { background: transparent; color: var(--muted); border-style: dashed; }
    .ghost { color: var(--muted); }
    .status-done { color: var(--ok); }
    .status-error { color: var(--bad); }
    .status-running { color: var(--run); }
    .status-queued { color: var(--accent); }
    .card.running { border-color: #3a5274; }
    .card.queued { opacity: 0.85; }
    .pulse { display: inline-block; width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--run); margin-right: 0.35rem; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .composer {
      padding: 0.45rem 1rem 0.55rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .row { display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }
    textarea {
      width: 100%;
      min-height: 3.2rem;
      resize: vertical;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.5rem 0.6rem;
      font: inherit;
    }
    input[type="text"] {
      flex: 1;
      min-width: 7rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.3rem 0.45rem;
      font: inherit;
    }
    select, button {
      background: #2a3140;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: #3d3420; border-color: var(--accent); color: var(--accent); }
    button.small { padding: 0.12rem 0.45rem; font-size: 0.78rem; }
    button:disabled { opacity: 0.5; cursor: wait; }
    pre.transcript {
      white-space: pre-wrap;
      font-size: 0.78rem;
      color: #c9c6bf;
      margin: 0.4rem 0 0;
      max-height: 14rem;
      overflow: auto;
    }
    pre.diff {
      white-space: pre;
      font-size: 0.68rem;
      color: #a8d1ff;
      background: #0a0e14;
      margin: 0.3rem 0 0;
      max-height: 10rem;
      overflow: auto;
      border: 1px solid var(--line);
      padding: 0.25rem;
      font-family: ui-monospace, monospace;
    }
    .err { color: var(--bad); }
    [hidden] { display: none !important; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 999px;
      padding: 0.12rem 0.55rem;
      font-size: 0.78rem;
    }
    .chip button { padding: 0 0.15rem; border: 0; background: transparent; color: var(--muted); }
    .summary { margin: 0.25rem 0 0.2rem; }
    .role { color: var(--accent); font-size: 0.75rem; }
    #thread { padding: 0 1rem 0.75rem; overflow: auto; }
    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
      .rail, .team { max-height: 14rem; }
    }
  </style>
</head>
<body>
  <header>
    <strong>Switchboard</strong>
    <span class="counts" id="counts">desk + team</span>
    <span id="health" class="ghost" style="margin-left:auto"></span>
  </header>
  <div class="composer">
    <textarea id="box" placeholder="Steer the desk — it will run a contest (two implementers + a reviewer). Or pick one worker. Ctrl+Enter sends."></textarea>
    <div class="row">
      <label>To
        <select id="worker">
          <option value="">Grok (desk)</option>
        </select>
      </label>
      <label><input type="checkbox" id="allowTools" /> allow tools</label>
      <button type="button" class="small" id="resumeLast" hidden>Resume last session</button>
      <span id="sessionChip" hidden class="chip">
        <span id="sessionLabel"></span>
        <button type="button" id="clearSession" title="clear session">×</button>
      </span>
      <button class="primary" type="button" id="send">Send</button>
      <span class="ghost" id="hint"></span>
    </div>
  </div>
  <main>
    <aside class="rail">
      <h2>Projects</h2>
      <div id="projects"></div>
      <div class="form">
        <h2>New</h2>
        <div class="row"><input id="newDir" type="text" placeholder="C:\path\to\project" /></div>
        <div class="row"><input id="newBrief" type="text" placeholder="brief (optional)" /></div>
        <button type="button" id="addProject">Add project</button>
      </div>
      <div class="form" id="briefBox" hidden>
        <h2>Brief</h2>
        <div class="row"><input id="briefEdit" type="text" placeholder="what this project is" /></div>
        <button type="button" class="small" id="saveBrief">Save brief</button>
      </div>
    </aside>
    <section class="desk">
      <div style="padding:0.75rem 1rem 0"><h2 id="threadTitle">Desk</h2></div>
      <div id="thread"></div>
    </section>
    <aside class="team">
      <h2>Contests</h2>
      <div id="contests"></div>
      <h2>Scoreboard</h2>
      <div id="scores" class="ghost"></div>
      <h2>Team</h2>
      <div id="runs"></div>
    </aside>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let projects = [];
    let current = localStorage.getItem("sb-project") || null;
    let poll = null;
    let reply = { session_id: "", parent_run_id: "", worker: "" };
    let lastRuns = [];
    let lastContests = [];
    const openPanels = {};

    function panelState(id) {
      if (!openPanels[id]) openPanels[id] = { transcript: false, diff: false, transcriptText: "", diffText: "" };
      return openPanels[id];
    }

    function fmtTime(ts) {
      if (!ts) return "";
      try {
        return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      } catch {
        return "";
      }
    }

    function elapsed(ts) {
      if (!ts) return "";
      const ms = Date.now() - new Date(ts).getTime();
      if (ms < 0) return "";
      const s = Math.floor(ms / 1000);
      if (s < 60) return s + "s";
      return Math.floor(s / 60) + "m " + (s % 60) + "s";
    }

    async function api(path, opts) {
      const r = await fetch(path, opts);
      const ct = r.headers.get("content-type") || "";
      const body = ct.includes("application/json") ? await r.json() : await r.text();
      if (!r.ok) throw new Error((body && body.error) || r.statusText);
      return body;
    }

    function setReply(next) {
      reply = { session_id: "", parent_run_id: "", worker: "", ...next };
      const chip = $("sessionChip");
      if (reply.session_id) {
        chip.hidden = false;
        $("sessionLabel").textContent = `resume ${reply.worker} ${reply.session_id}`;
        $("worker").value = reply.worker;
      } else {
        chip.hidden = true;
        $("sessionLabel").textContent = "";
      }
      updateResumeLast();
    }

    function updateResumeLast() {
      const w = $("worker").value;
      const btn = $("resumeLast");
      const hit = lastRuns.find((r) => r.worker === w && r.session_id);
      const already = reply.session_id && reply.worker === w;
      btn.hidden = !(w && hit && !already);
    }

    async function refreshHealth() {
      try {
        const h = await api("/api/health");
        $("health").textContent = (h.dispatcher_exists ? "dispatcher ok" : "dispatcher missing")
          + " · " + (h.grok ? "grok" : "no grok")
          + " · pid " + (h.pid || "?");
        $("health").className = h.dispatcher_exists ? "ghost" : "err";
      } catch (e) {
        $("health").textContent = String(e);
        $("health").className = "err";
      }
    }

    async function loadWorkers() {
      const { workers } = await api("/api/workers");
      const sel = $("worker");
      const keep = sel.value;
      sel.innerHTML = '<option value="">Grok (desk)</option>';
      for (const w of workers) {
        const o = document.createElement("option");
        o.value = w;
        o.textContent = w;
        sel.appendChild(o);
      }
      if (keep) sel.value = keep;
    }

    async function loadProjects() {
      const data = await api("/api/projects");
      projects = data.projects || [];
      const box = $("projects");
      box.innerHTML = "";
      if (!projects.length) {
        box.innerHTML = '<p class="ghost">Add a project directory.</p>';
        $("briefBox").hidden = true;
        return;
      }
      if (!current || !projects.find((p) => p.id === current)) current = projects[0].id;
      localStorage.setItem("sb-project", current);
      for (const p of projects) {
        const el = document.createElement("div");
        el.className = "item" + (p.id === current ? " active" : "");
        el.innerHTML = `${escapeHtml(p.id)}<small>${escapeHtml(p.dir)}</small>`;
        el.onclick = () => { current = p.id; localStorage.setItem("sb-project", current); setReply({}); render(); };
        box.appendChild(el);
      }
      const proj = projects.find((p) => p.id === current);
      $("briefBox").hidden = !proj;
      if (proj) $("briefEdit").value = proj.brief || "";
    }

    async function render() {
      await loadProjects();
      const proj = projects.find((p) => p.id === current);
      $("threadTitle").textContent = proj ? `Desk · ${proj.id}` : "Desk";
      if (!proj) {
        $("thread").innerHTML = '<p class="ghost">No project selected.</p>';
        $("runs").innerHTML = "";
        lastRuns = [];
        $("counts").textContent = "desk + team";
        return;
      }
      const th = await api(`/api/projects/${proj.id}/thread`);
      const thread = $("thread");
      thread.innerHTML = "";
      for (const ev of th.events || []) {
        const el = document.createElement("div");
        el.className = "msg" + (ev.role === "user" ? " user" : ev.role === "system" ? " system" : "");
        el.innerHTML = `${escapeHtml(ev.text || "")}<small>${fmtTime(ev.ts)} · ${escapeHtml(ev.role)}${ev.run_ids ? " · " + ev.run_ids.join(",") : ""}</small>`;
        thread.appendChild(el);
      }
      thread.scrollTop = thread.scrollHeight;
      const [rs, cs, sc] = await Promise.all([
        api(`/api/projects/${proj.id}/runs`),
        api(`/api/projects/${proj.id}/contests`),
        api(`/api/projects/${proj.id}/scores`),
      ]);
      lastRuns = rs.runs || [];
      lastContests = cs.contests || [];
      const scoreBox = $("scores");
      const ranked = sc.ranked || [];
      const scores = sc.scores || {};
      scoreBox.innerHTML = ranked.map((w) => {
        const s = scores[w] || {};
        return `${escapeHtml(w)} ${s.wins || 0}w/${s.vetoes || 0}v`;
      }).join(" · ") || "no scores yet";
      const contestsEl = $("contests");
      contestsEl.innerHTML = "";
      if (!lastContests.length) contestsEl.innerHTML = '<p class="ghost">Desk opens a contest when you ask for work.</p>';
      for (const c of lastContests.slice(0, 6)) {
        const el = document.createElement("div");
        el.className = "card";
        const awaiting = c.status === "awaiting_desk";
        const impl = (c.implementer_run_ids || []).join(", ");
        el.innerHTML = `<span class="status-${escapeHtml(c.status === "approved" ? "done" : c.status === "vetoed" || c.status === "error" ? "error" : "running")}">${escapeHtml(c.status)}</span>
          <small>${escapeHtml(c.id)} · ${escapeHtml((c.implementers || []).join(" vs "))} · review ${escapeHtml(c.reviewer || "")}</small>
          <div class="summary">${escapeHtml(c.goal || "")}</div>
          <small>runs ${escapeHtml(impl)}${c.winner_run_id ? " · winner " + c.winner_run_id : ""}</small>
          ${awaiting ? `<div class="row">
            ${(c.implementer_run_ids || []).map((rid) => `<button type="button" class="small" data-approve="${rid}">approve ${rid}</button>`).join("")}
            <button type="button" class="small" data-veto>veto all</button>
          </div>` : ""}
          ${c.reason ? `<small>${escapeHtml(c.reason)}</small>` : ""}`;
        el.querySelectorAll("[data-approve]").forEach((btn) => {
          btn.onclick = (e) => { e.stopPropagation(); sendVerdict(c.id, "approve", btn.getAttribute("data-approve")); };
        });
        const veto = el.querySelector("[data-veto]");
        if (veto) veto.onclick = (e) => { e.stopPropagation(); sendVerdict(c.id, "veto", ""); };
        contestsEl.appendChild(el);
      }
      const running = lastRuns.filter((r) => r.status === "running").length;
      const queued = lastRuns.filter((r) => r.status === "queued").length;
      const done = lastRuns.filter((r) => r.status === "done").length;
      $("counts").innerHTML = `<b>${running}</b> running · <b>${queued}</b> queued · <b>${done}</b> done`;
      const runs = $("runs");
      runs.innerHTML = "";
      if (!lastRuns.length) runs.innerHTML = '<p class="ghost">No team yet. Desk can dispatch, or pick a worker.</p>';
      for (const r of lastRuns) {
        const el = document.createElement("div");
        el.className = "card " + r.status + (reply.parent_run_id === r.id ? " open" : "");
        const sid = r.session_id
          ? r.session_id
          : (r.status === "running" ? "attaching session…" : "no session");
        const wait = r.status === "running" ? elapsed(r.started_at) : "";
        const pulse = r.status === "running" ? '<span class="pulse"></span>' : "";
        const role = r.role ? `<span class="role">${escapeHtml(r.role)}</span> · ` : "";
        const contestBit = r.contest_id ? ` · contest ${escapeHtml(r.contest_id)}` : "";
        el.innerHTML = `<span class="status-${escapeHtml(r.status)}">${pulse}${role}${escapeHtml(r.worker)} · ${escapeHtml(r.status)}${wait ? " · " + wait : ""}</span>
          <small>${fmtTime(r.started_at)} · ${escapeHtml(r.id)} · ${escapeHtml(sid)}${contestBit}</small>
          <div class="summary">${escapeHtml(r.summary || r.prompt || "")}</div>
          <div class="row">
            <button type="button" class="small" data-open>transcript</button>
            <button type="button" class="small" data-diff>diff</button>
            <button type="button" class="small" data-review ${r.session_id ? "" : "disabled"}>review</button>
            <button type="button" class="small" data-reply ${r.session_id ? "" : "disabled"}>reply</button>
          </div>
          <pre class="transcript" hidden></pre>
          <pre class="diff" hidden></pre>`;
        restorePanels(el, r.id);
        el.querySelector("[data-open]").onclick = (e) => { e.stopPropagation(); openTranscript(el, r.id); };
        el.querySelector("[data-reply]").onclick = (e) => {
          e.stopPropagation();
          if (!r.session_id) return;
          setReply({ session_id: r.session_id, parent_run_id: r.id, worker: r.worker });
          $("box").focus();
        };
        const diffBtn = el.querySelector("[data-diff]");
        if (diffBtn) diffBtn.onclick = (e) => { e.stopPropagation(); openDiff(el, r.id); };
        const reviewBtn = el.querySelector("[data-review]");
        if (reviewBtn) reviewBtn.onclick = (e) => {
          e.stopPropagation();
          if (!r.session_id) return;
          setReply({ session_id: r.session_id, parent_run_id: r.id, worker: r.worker });
          $("box").value = `review the diff and output of run ${escapeHtml(r.id)}`;
          $("box").focus();
        };
        runs.appendChild(el);
      }
      updateResumeLast();
      const busy = lastRuns.some((r) => r.status === "running" || r.status === "queued")
        || lastContests.some((c) => c.status === "competing" || c.status === "reviewing");
      if (busy && !poll) poll = setInterval(render, 2000);
      if (!busy && poll) { clearInterval(poll); poll = null; }
    }

    function restorePanels(card, id) {
      const st = panelState(id);
      const tPre = card.querySelector("pre.transcript");
      const dPre = card.querySelector("pre.diff");
      if (st.transcript) {
        tPre.hidden = false;
        tPre.textContent = st.transcriptText || "loading…";
      }
      if (st.diff) {
        dPre.hidden = false;
        dPre.textContent = st.diffText || "loading…";
      }
    }

    async function openTranscript(card, id) {
      const pre = card.querySelector("pre.transcript");
      const st = panelState(id);
      st.transcript = !st.transcript;
      pre.hidden = !st.transcript;
      if (!st.transcript) return;
      if (st.transcriptText) {
        pre.textContent = st.transcriptText;
        return;
      }
      pre.textContent = "loading…";
      try {
        st.transcriptText = await api(`/api/runs/${id}/transcript`);
        pre.textContent = st.transcriptText;
      } catch (e) {
        pre.textContent = String(e);
      }
    }

    async function openDiff(card, id) {
      const pre = card.querySelector("pre.diff");
      const st = panelState(id);
      st.diff = !st.diff;
      pre.hidden = !st.diff;
      if (!st.diff) return;
      if (st.diffText) {
        pre.textContent = st.diffText;
        return;
      }
      pre.textContent = "loading…";
      try {
        const text = await api(`/api/runs/${id}/transcript`);
        st.diffText = extractDiff(text) || "(no diff found in transcript)";
        pre.textContent = st.diffText;
      } catch (e) {
        pre.textContent = String(e);
      }
    }

    function extractDiff(text) {
      if (!text) return "";
      const lines = String(text).split(/\r?\n/);
      const out = [];
      let capturing = false;
      for (const line of lines) {
        const s = line.trim();
        if (
          s.startsWith("diff --git") ||
          s.includes("\u2192") ||
          s.startsWith("@@") ||
          s.startsWith("--- ") ||
          s.startsWith("+++ ") ||
          s.startsWith("a/") ||
          s.startsWith("b/")
        ) {
          capturing = true;
        }
        if (capturing) out.push(line);
      }
      return out.join("\n").trim();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    async function sendVerdict(contestId, decision, winner) {
      if (!current) return;
      $("hint").textContent = "recording verdict…";
      try {
        await api(`/api/projects/${current}/contests/${contestId}/verdict`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ decision, winner_run_id: winner, reason: "operator " + decision }),
        });
        await render();
        $("hint").textContent = "";
      } catch (e) {
        $("hint").textContent = String(e);
        $("hint").className = "err";
      }
    }

    $("addProject").onclick = async () => {
      $("hint").textContent = "";
      try {
        const created = await api("/api/projects", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ dir: $("newDir").value, brief: $("newBrief").value }),
        });
        $("newDir").value = "";
        $("newBrief").value = "";
        current = created.id;
        await render();
      } catch (e) { $("hint").textContent = String(e); $("hint").className = "err"; }
    };

    $("saveBrief").onclick = async () => {
      if (!current) return;
      try {
        await api(`/api/projects/${current}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ brief: $("briefEdit").value }),
        });
        $("hint").textContent = "brief saved";
        $("hint").className = "ghost";
        await render();
      } catch (e) { $("hint").textContent = String(e); $("hint").className = "err"; }
    };

    $("send").onclick = async () => {
      if (!current) { $("hint").textContent = "Add a project first."; return; }
      const text = $("box").value.trim();
      if (!text) return;
      $("send").disabled = true;
      $("hint").textContent = "sending…";
      $("hint").className = "ghost";
      try {
        await api(`/api/projects/${current}/message`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text,
            worker: $("worker").value,
            allow_tools: $("allowTools").checked,
            session_id: reply.session_id || "",
            parent_run_id: reply.parent_run_id || "",
          }),
        });
        $("box").value = "";
        await render();
        $("hint").textContent = "";
      } catch (e) {
        $("hint").textContent = String(e);
        $("hint").className = "err";
      } finally {
        $("send").disabled = false;
      }
    };

    $("clearSession").onclick = () => setReply({});
    $("worker").onchange = () => {
      if (reply.worker && $("worker").value !== reply.worker) setReply({});
      updateResumeLast();
    };
    $("resumeLast").onclick = () => {
      const w = $("worker").value;
      const hit = lastRuns.find((r) => r.worker === w && r.session_id);
      if (hit) setReply({ session_id: hit.session_id, parent_run_id: hit.id, worker: w });
    };
    $("box").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("send").click();
    });

    (async () => {
      try {
        await refreshHealth();
        await loadWorkers();
        await render();
      } catch (e) {
        $("hint").textContent = String(e);
        $("hint").className = "err";
      }
    })();
  </script>
</body>
</html>
